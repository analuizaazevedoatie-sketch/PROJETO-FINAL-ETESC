<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar - SoulDiary</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main>
    <div class="auth-wrapper">
      <h1>Bem-vindo de volta</h1>
      <p class="auth-subtitulo">Entre para continuar seu diario de filmes, series, livros e musicas.</p>

      <div class="mensagem" id="mensagem"></div>

      <form id="form-login" novalidate>
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="voce@email.com" required />
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Sua senha" required />
        </div>
        <button type="submit" class="btn btn-primario btn-bloco" id="btn-entrar">Entrar</button>
      </form>

      <p class="auth-rodape">
        Ainda nao tem conta? <a href="cadastro.html">Criar conta</a><br />
        <a href="index.html">Voltar para a Home</a>
      </p>
    </div>
  </main>

  <footer class="rodape">SoulDiary &middot; seu diario de historias</footer>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
