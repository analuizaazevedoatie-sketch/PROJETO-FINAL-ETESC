<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minha Biblioteca - SoulDiary</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <main>
    <h1>Minha Biblioteca</h1>

    <div class="filtros-tipo" id="filtros-tipo">
      <button class="chip-filtro ativo" data-tipo="">Todos</button>
      <button class="chip-filtro" data-tipo="filme">Filmes</button>
      <button class="chip-filtro" data-tipo="serie">Series</button>
      <button class="chip-filtro" data-tipo="livro">Livros</button>
      <button class="chip-filtro" data-tipo="musica">Musicas</button>
    </div>

    <div id="conteudo-biblioteca">
      <div class="carregando">Carregando sua biblioteca...</div>
    </div>
  </main>

  <footer class="rodape">SoulDiary &middot; seu diario de historias</footer>

  <script src="js/api.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/biblioteca.js"></script>
</body>
</html>
